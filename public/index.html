<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="mobile-web-app-capable" content="yes">

  <title>PBC Charters | Punchbowl Bus</title>
  <meta name="description" content="Punchbowl Bus – Driver & Admin Portal">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#c62828">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Link to your styles.css file -->
  <link rel="stylesheet" href="styles.css">

  <style>
    :root { --red:#c62828; --bg:#f6f6f6; --card:#fff; --border:#e5e5e5; }
    body { margin:0; font-family: Arial, sans-serif; background:var(--bg); }

    /* Top bar */
    .topbar{
      background:var(--red); color:#fff; padding:12px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brandTitle{ font-weight:900; font-size:20px; }
    .brandSub{ opacity:.9; font-size:12px; margin-top:2px; }

    /* App layout */
    .app { display:flex; min-height: calc(100vh - 52px); }
    .sidebar{
      width:260px; background:#fff; border-right:1px solid var(--border);
      padding:12px;
    }
    .main{ flex:1; padding:16px; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }

    .menuTitle{ font-size:12px; color:#666; margin:10px 8px 6px; }
    .navBtn{
      width:100%;
      display:flex; align-items:center; gap:10px;
      border:1px solid transparent;
      background:#fff; padding:10px 10px;
      border-radius:12px; cursor:pointer; text-align:left;
    }
    .navBtn:hover{ background:#f7f7f7; }
    .navBtn.active{ background:#fdecec; border-color:#f5bcbc; }

    .muted { color:#666; font-size:13px; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#f1f1f1; margin-left:8px; font-size:12px; }

    button { padding:10px 14px; border:1px solid #ccc; background:#fff; border-radius:10px; cursor:pointer; }
    input, textarea, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:10px; box-sizing:border-box; }

    #errorArea { display:none; background:#ffe9e9; border:1px solid #ffb3b3; padding:12px; border-radius:12px; margin-bottom:12px; }

    /* Mobile */
    @media (max-width: 820px){
      .sidebar{ width:200px; }
    }
    @media (max-width: 650px){
      .app{ flex-direction:column; }
      .sidebar{ width:auto; border-right:none; border-bottom:1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brandTitle">PBC Charters</div>
        <div class="brandSub">Punchbowl Bus – Driver & Admin Portal</div>
      </div>
    </div>
    <div id="authArea"></div>
  </div>

  <div class="app">
    <div class="sidebar">
      <div class="menuTitle">MENU</div>
      <div id="navArea"></div>

      <div class="menuTitle" style="margin-top:14px;">DISPATCH</div>
      <div id="adminNavArea"></div>

      <div class="muted" style="margin-top:14px;">
        Tip: Add to Home Screen to install as an app.
      </div>
    </div>

    <div class="main">
      <div id="tabsArea" style="display:none"></div>
      <div id="errorArea"></div>
      <div id="contentArea" class="card" style="display:none;"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
      });
    }
  </script>
</body>
</html>
