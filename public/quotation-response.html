<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charter Quotation Response | Punchbowl Bus</title>
  <meta name="description" content="Accept or decline your charter quotation from Punchbowl Bus Company." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      color: #142033;
    }
    .response-card {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(0,0,0,.1);
      overflow: hidden;
      text-align: center;
    }
    .response-header {
      background: linear-gradient(135deg, #c62828, #a91f24);
      padding: 24px 28px;
      color: #fff;
    }
    .response-header h1 { font-size: 20px; font-weight: 700; }
    .response-header p { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.8); }
    .response-body { padding: 36px 28px; }
    .spinner {
      display: inline-block;
      width: 40px; height: 40px;
      border: 4px solid #dce3ec;
      border-top-color: #c62828;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .response-body h2 { font-size: 20px; margin-bottom: 8px; }
    .response-body p { font-size: 14px; color: #64748b; line-height: 1.6; }
    .response-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: grid; place-items: center;
      margin: 0 auto 16px;
      font-size: 28px; color: #fff;
    }
    .response-icon.success { background: #16a34a; }
    .response-icon.error { background: #dc2626; }
    .response-icon.expired { background: #f59e0b; }
    .response-footer {
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 1px solid #dce3ec;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="response-card">
    <div class="response-header">
      <h1>Punchbowl Bus Company</h1>
      <p>Charter Quotation Response</p>
    </div>
    <div class="response-body" id="responseBody">
      <div class="spinner"></div>
      <h2>Processing your response…</h2>
      <p>Please wait while we record your decision.</p>
    </div>
    <div class="response-footer">
      Punchbowl Bus Company &nbsp;|&nbsp; (02) XXXX XXXX &nbsp;|&nbsp; charters@punchbowlbus.com.au
    </div>
  </div>

  <script type="module" src="./js/quotation_response.js"></script>
</body>
</html>
